# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, e.g. receiver/prometheus, exporter/otlp, ...
component: receiver/haproxy

# A brief description of the change. Surround your text with quotes ("...") if it contains special characters.
change_description: Enable reaggregation for HAProxy receiver metrics

# One or more tracking issues related to the change
issues: [46385]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the changelog.
# Use pipe (|) for multiline entries.
additional_details: |
  Enables the `WithStartTimeOverride` option for HAProxy receiver metrics to support
  reaggregation. This allows the receiver to properly handle cumulative metrics
  when the HAProxy process restarts or metrics are reset.
